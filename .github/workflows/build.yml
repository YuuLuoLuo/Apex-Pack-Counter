name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            artifact: APEX-Pack-Counter-windows
          - platform: macos
            os: macos-latest
            artifact: APEX-Pack-Counter-macos
          - platform: linux
            os: ubuntu-latest
            artifact: APEX-Pack-Counter-linux

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q main.py

      - name: Build with PyInstaller
        run: python -m PyInstaller --clean --noconfirm --distpath "dist/${{ matrix.artifact }}" main.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: APEX-Pack-Counter-*
          path: release-assets

      - name: Package release files
        shell: bash
        run: |
          set -euo pipefail
          for directory in release-assets/*; do
            name="$(basename "$directory")"
            (cd release-assets && zip -r "../${name}.zip" "$name")
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" *.zip --generate-notes --title "${GITHUB_REF_NAME}"